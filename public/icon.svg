<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a1628"/>
      <stop offset="100%" stop-color="#152a4a"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <circle cx="256" cy="120" r="60" fill="none" stroke="#1e90ff" stroke-width="4" opacity=".3"/>
  <circle cx="256" cy="120" r="40" fill="none" stroke="#1e90ff" stroke-width="3" opacity=".5"/>
  <circle cx="256" cy="120" r="20" fill="none" stroke="#1e90ff" stroke-width="2" opacity=".7"/>
  <circle cx="256" cy="120" r="4" fill="#1e90ff" opacity=".9"/>
  <!-- Ship: Carrier top-down -->
  <g transform="translate(256,280)">
    <rect x="-120" y="-20" width="240" height="40" rx="6" fill="#6a7a8a" stroke="#4a5a6a" stroke-width="2"/>
    <rect x="-110" y="-12" width="210" height="8" rx="2" fill="#556" opacity=".5"/>
    <rect x="-110" y="4" width="210" height="8" rx="2" fill="#556" opacity=".5"/>
    <rect x="70" y="-28" width="40" height="16" rx="3" fill="#4a5a6a"/>
    <rect x="80" y="-34" width="15" height="8" rx="2" fill="#5a6a7a"/>
    <polygon points="-110,0 -95,-6 -95,6" fill="#ffd700" opacity=".8"/>
    <text x="0" y="52" text-anchor="middle" fill="#8899aa" font-family="system-ui" font-size="16" font-weight="bold">HUNDIR LA FLOTA</text>
  </g>
  <!-- Crosshair hit marks -->
  <g transform="translate(156,400)" opacity=".6">
    <line x1="-12" y1="-12" x2="12" y2="12" stroke="#ff4444" stroke-width="4" stroke-linecap="round"/>
    <line x1="12" y1="-12" x2="-12" y2="12" stroke="#ff4444" stroke-width="4" stroke-linecap="round"/>
  </g>
  <g transform="translate(376,380)" opacity=".4">
    <circle cx="0" cy="0" r="8" fill="none" stroke="#8899aa" stroke-width="3"/>
  </g>
  <!-- Grid lines -->
  <g opacity=".08">
    <line x1="80" y1="440" x2="432" y2="440" stroke="#fff" stroke-width="1"/>
    <line x1="80" y1="455" x2="432" y2="455" stroke="#fff" stroke-width="1"/>
    <line x1="80" y1="470" x2="432" y2="470" stroke="#fff" stroke-width="1"/>
    <line x1="80" y1="440" x2="80" y2="485" stroke="#fff" stroke-width="1"/>
    <line x1="168" y1="440" x2="168" y2="485" stroke="#fff" stroke-width="1"/>
    <line x1="256" y1="440" x2="256" y2="485" stroke="#fff" stroke-width="1"/>
    <line x1="344" y1="440" x2="344" y2="485" stroke="#fff" stroke-width="1"/>
    <line x1="432" y1="440" x2="432" y2="485" stroke="#fff" stroke-width="1"/>
  </g>
</svg>
